# Nginx reverse proxy for payment-service
# Domain: payments.transpip.com → http://127.0.0.1:4040
#
# Install:
#   cp deploy/nginx/payments.transpip.com.conf /etc/nginx/sites-available/payments.transpip.com
#   ln -sf /etc/nginx/sites-available/payments.transpip.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# HTTPS (after install): certbot will rewrite this file with SSL + redirect:
#   certbot --nginx -d payments.transpip.com --redirect --agree-tos -m <email> --non-interactive

server {
    listen 80;
    listen [::]:80;
    server_name payments.transpip.com;

    # XentriPay webhook bodies are HMAC-signed over the exact raw bytes —
    # nginx forwards them unmodified, which is exactly what verification needs.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
